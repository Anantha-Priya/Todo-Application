<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
<main class="container auth-card">
    <div class="brand-mark" aria-hidden="true">✓</div>
    <p class="eyebrow">START FRESH</p>
    <h2>Build better days.</h2>
    <p class="intro">Create an account and turn intentions into completed tasks.</p>
    <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <label for="password">Create a password</label>
        <input type="password" id="password" placeholder="Choose a secure password" />
    </div>
    <button class="primary-button" onclick="register()">Create account <span aria-hidden="true">→</span></button>
    <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
</main>

<script src="script.js"></script>
</body>
</html>
