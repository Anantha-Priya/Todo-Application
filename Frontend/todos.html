<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Todos</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="todo-page">
    <main class="container todo-shell">
        <header class="todo-header">
            <div>
                <p class="eyebrow">YOUR FOCUS LIST</p>
                <h2>Today's tasks</h2>
                <p class="intro">Small steps add up to meaningful progress.</p>
            </div>
            <div class="header-actions">
                <a class="sign-in-link" href="login.html">Sign in</a>
                <div class="header-mark" aria-hidden="true">✓</div>
            </div>
        </header>
        <div id="todo-list" class="todo-cards" aria-live="polite">
            <p id="empty-message">Loading your todos...</p>
        </div>

        <div class="add-todo">
            <div class="todo-fields">
                <input type="text" id="new-todo" placeholder="Todo title" aria-label="Todo title" />
                <textarea id="new-description" placeholder="Description (optional)" aria-label="Todo description"></textarea>
            </div>
            <button onclick="addTodo()"><span aria-hidden="true">+</span> Add task</button>
        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
