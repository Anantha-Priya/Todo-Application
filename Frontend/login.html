<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
<main class="container auth-card">
    <div class="brand-mark" aria-hidden="true">✓</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h2>Ready to make progress?</h2>
    <p class="intro">Sign in to keep your day beautifully organized.</p>
    <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
    </div>
    <button class="primary-button" onclick="login()">Sign in <span aria-hidden="true">→</span></button>
    <p class="auth-footer">New here? <a href="register.html">Create an account</a></p>
</main>

<script src="script.js"></script>
</body>
</html>
